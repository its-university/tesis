name: Build thesis

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-extra texlive-fonts-recommended texlive-science tex-gyre

      - name: Build cover and thesis
        run: bash scripts/build.sh

      - name: Upload compiled PDFs
        uses: actions/upload-artifact@v4
        with:
          name: thesis-pdfs
          path: |
            cover.pdf
            main.pdf
